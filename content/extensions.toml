# Curated editor extensions, installed by `harness warmup` (or the last step of `harness install`)
# only after you approve the list. Evidence checked live on 2026-09-30:
#   VS Code Marketplace gallery API (publisher.isDomainVerified, install count, lastUpdated, source link,
#   VSIX size) and Open VSX API (/api/<ns>/<name>: verified, repository, licence), and the GitHub API
#   for each source repo (archived? last push).
#
# Fields
#   id         extension id as `code --install-extension` takes it
#   publisher  display name of the publisher
#   verified   "yes" = the marketplace shows the publisher's domain as verified
#   source     official source (or issue tracker, where the product is closed source)
#   why        what it does for our work
#   size_mb    approximate download size (VSIX), rounded up
#   targets    "vscode" and/or "cursor"
#   where      for Remote-SSH: "local" (runs on your laptop), "remote" (runs on the server), "both"
#   requires   optional: only offered when that harness tool is chosen
#   evidence   the numbers the decision rests on
#
# Microsoft's licences allow Pylance, Remote-SSH, Data Wrangler (and C/C++, Live Share) only in
# Microsoft's VS Code products, so none of those is ever targeted at Cursor. Cursor ships its own
# first-party equivalents from Anysphere, the company that makes Cursor.

[settings]
"telemetry.telemetryLevel" = "off"
"redhat.telemetry.enabled" = false

# ---------------------------------------------------------------- Python

[[extension]]
id = "ms-python.python"
publisher = "Microsoft"
verified = "yes"
source = "https://github.com/Microsoft/vscode-python"
why = "Python language support, environments, testing; the base every other Python tool builds on"
size_mb = 19
targets = ["vscode", "cursor"]
where = "remote"
evidence = "Marketplace: microsoft.com verified, 238.9M installs, updated 2026-09-25. Open VSX: verified, MIT, 59.5M downloads. Repo pushed 2026-09-29."

[[extension]]
id = "ms-python.vscode-pylance"
publisher = "Microsoft"
verified = "yes"
source = "https://github.com/microsoft/pylance-release"
why = "fast type checking, completions and go-to-definition for Python"
size_mb = 30
targets = ["vscode"]
where = "remote"
evidence = "Marketplace: microsoft.com verified, 205.6M installs, updated 2026-09-23. Closed source (repo is the issue tracker, pushed 2026-09-25). Licence: Microsoft products only; not on Open VSX."

[[extension]]
id = "anysphere.cursorpyright"
publisher = "Anysphere (makers of Cursor)"
verified = "yes"
source = "https://forum.cursor.com/t/conflict-between-anysphere-cursorpyright-and-ms-python-python-over-python-venvpath-setting/145877"
why = "Cursor's own Python language server, in place of Pylance which Cursor may not use"
size_mb = 20
targets = ["cursor"]
where = "remote"
evidence = "First-party: published by Anysphere in Cursor's own extension gallery (not on Open VSX). Size not measured."

[[extension]]
id = "ms-python.debugpy"
publisher = "Microsoft"
verified = "yes"
source = "https://github.com/microsoft/vscode-python-debugger"
why = "Python debugger: breakpoints in scripts, tests and notebooks"
size_mb = 8
targets = ["vscode", "cursor"]
where = "remote"
evidence = "Marketplace: microsoft.com verified, 144.3M installs, updated 2026-09-14. Open VSX: verified, MIT, 60.4M downloads. Repo pushed 2026-09-29."

[[extension]]
id = "charliermarsh.ruff"
publisher = "Astral Software"
verified = "yes"
source = "https://github.com/astral-sh/ruff-vscode"
why = "Ruff linter and formatter: catches bugs and keeps research code tidy, in milliseconds"
size_mb = 12
targets = ["vscode", "cursor"]
where = "remote"
evidence = "Marketplace: astral.sh verified, 4.7M installs, updated 2026-09-24. Open VSX: verified, MIT, 3.5M downloads, same version. Repo pushed 2026-09-29."

