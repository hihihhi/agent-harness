# ---------------------------------------------------------------- remote

[[extension]]
id = "ms-vscode-remote.remote-ssh"
publisher = "Microsoft"
verified = "yes"
source = "https://github.com/Microsoft/vscode-remote-release"
why = "work on the Linux research server over SSH as if it were local"
size_mb = 1
targets = ["vscode"]
where = "local"
evidence = "Marketplace: microsoft.com verified, 37.7M installs, updated 2026-09-18, extensionKind ui. Licence: Microsoft products only; not on Open VSX. Repo pushed 2026-09-04."

[[extension]]
id = "anysphere.remote-ssh"
publisher = "Anysphere (makers of Cursor)"
verified = "yes"
source = "https://forum.cursor.com/t/anysphere-remote-ssh-keeps-coming-back/159173"
why = "Cursor's own Remote-SSH, in place of Microsoft's which Cursor may not use"
size_mb = 2
targets = ["cursor"]
where = "local"
evidence = "First-party: published by Anysphere in Cursor's own extension gallery (not on Open VSX). Conflicts with ms-vscode-remote.remote-ssh, which must not be installed in Cursor. Size not measured."

