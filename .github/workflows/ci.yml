name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the secret scan reads every commit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest and ruff (the quality eval's lint grader fails when ruff is absent, by design)
        run: python -m pip install pytest ruff
      - name: Tests (harness, guard corpus, eval instrument)
        run: python -m pytest -q tests eval
      - name: Install gitleaks 8.30.1 (pinned, checksum-verified), so the history scan runs here as it does locally
        run: |
          curl -fsSL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks && sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Secret scan (scanner self-test, then working tree and history)
        run: |
          bash scripts/secret-scan.sh --self-test
          bash scripts/secret-scan.sh
      - name: Demo (throwaway home)
        run: bash scripts/demo.sh
