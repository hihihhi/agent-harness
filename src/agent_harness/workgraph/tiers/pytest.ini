# Test tiers — copy into a project root as pytest.ini (or fold into pyproject).
#
# Four tiers, four gate commands, one mark each. Not four subsystems and not
# four agents. A plan node's gate is one of:
#
#     pytest -m case          pytest -m integration
#     pytest -m property      pytest -m eval
#
# --strict-markers is the load-bearing flag. Without it a typo'd mark silently
# selects nothing and the gate goes green over zero tests, which is the
# "absent artefact defaults to a pass" failure this project already learned once.
# With it, an undeclared mark is a collection error.
#
# pytest exits 5 when a tier selects no tests, so an EMPTY tier fails its gate
# rather than passing vacuously. That is deliberate: if a node claims an
# integration tier, the tier has to exist.

[pytest]
addopts = --strict-markers -q
testpaths = tests
markers =
    case: one concrete input/output pair — the cheapest tier, and the first to write.
    integration: crosses a real boundary — process, filesystem, network, model, GPU box.
    property: generated inputs over an invariant. Finds the edge cases nobody enumerates.
    eval: scores a non-deterministic output against a threshold. Must state the threshold.

# SCOPE A NODE'S GATE TO THE FILES THAT NODE OWNS. Learned the hard way in
# bin/e2e.test.sh: `pytest -m case` still COLLECTS every test file, so a sibling
# test whose module-level import names a not-yet-written module errors the whole
# run — and a node's gate fails because of work a different node has not done.
# Two nodes that looked disjoint were coupled through pytest's collection phase.
# Write the gate as:   pytest tests/test_case.py -m case
# Unscoped `pytest -m <tier>` is correct only for the final all-green check,
# once everything exists.
#
# property tier needs a generator; add per project:  pip install hypothesis
# and commit .hypothesis/examples — every counterexample it finds then becomes a
# permanent regression test for free.
